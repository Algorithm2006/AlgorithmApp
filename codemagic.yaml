workflows:
  android-release:
    name: Build AlgorithmApp APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      android:{}
    
    scripts:
      - name: Build release APK
        script: |
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk

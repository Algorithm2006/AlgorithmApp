workflows:
  android-release:
    name: Build AlgorithmApp APK
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Give gradlew permission
        script: |
          chmod +x ./gradlew
      - name: Build release APK
        script: |
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
